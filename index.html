<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereadores em Exercício - Câmara Municipal de Coronel Barros</title>
    <!-- 
        ESTILO DA PÁGINA (CSS)
        Este código foi desenvolvido para ser usado tanto diretamente quanto como embed (iframe).
        O design utiliza tons de verde oficiais da Câmara, fontes escuras para fundo claro e fotos na proporção 3:4.
    -->
    <style>
        :root {
            /* Paleta de Cores Oficial - Câmara de Coronel Barros */
            --primary-green: #325a1e; 
            --secondary-green: #5c854b;
            --accent-green: #3ebb51;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-color: #1a1a1a; 
            --text-muted: #555555;
            --gold: #b8860b; /* Destaque para a Presidência */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Embed Mode Overrides */
        body.is-embedded {
            min-height: auto !important;
            height: auto !important;
        }
        body.hide-header header {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 15px 20px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-green);
            border-bottom: 3px solid var(--secondary-green);
            display: inline-block;
            padding-bottom: 8px;
        }

        .section-title {
            width: 100%;
            text-align: center;
            margin: 35px 0 20px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary-green);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: var(--accent-green);
            margin: 6px auto 0;
            border-radius: 2px;
        }

        /* GRID DE VEREADORES */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 25px;
            width: 100%;
            justify-items: center;
        }

        /* LAYOUT DA MESA DIRETORA */
        #mesa-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        /* ESTILO DO CARD */
        .card {
            background: #ffffff;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 16px;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 230px;
            box-sizing: border-box;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
            border-color: var(--secondary-green);
        }

        /* CONTAINER DA FOTO (PROPORÇÃO 3:4) */
        .photo-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid #e8ece6;
            background: #f4f6f3;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card h3 {
            margin: 8px 0 4px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-green);
            line-height: 1.3;
        }

        .card p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* SELO DE CARGO (MESA DIRETORA) */
        .badge {
            position: absolute;
            top: -10px;
            background: var(--secondary-green);
            color: white;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }

        /* DESTAQUE DO PRESIDENTE */
        .president {
            border: 2px solid var(--gold) !important;
            background: linear-gradient(to bottom, #ffffff, #fffdf5);
        }
        
        .president .badge {
            background: var(--gold);
        }

        .president .photo-container {
            border-color: var(--gold);
        }

        /* MENSAGEM DE CARREGAMENTO */
        #loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.1rem;
            color: var(--secondary-green);
            font-weight: 600;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .card { width: 100%; max-width: 280px; }
            #mesa-grid { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VEREADORES EM EXERCÍCIO</h1>
        </header>

        <div id="loading">Conectando ao sistema SAPL...</div>
        
        <div id="content" style="display: none; width: 100%;">
            <div class="section-title">Mesa Diretora</div>
            <div id="mesa-grid"></div>

            <div class="section-title">Demais Vereadores</div>
            <div id="vereadores-grid" class="grid"></div>
        </div>
    </div>

    <script>
        /* 
            CONFIGURAÇÕES DA API
            Base URL do SAPL da Câmara Municipal de Coronel Barros
        */
        const API_BASE = 'https://sapl.coronelbarros.rs.leg.br/api';
        
        /* 
            Mapeamento de contingência para Mesa Diretora
        */
        const MESA_CARGOS_FALLBACK = {
            1: 'Presidente',      // Lucas Jair Wottrich
            7: 'Vice-Presidente', // Cristiana dos Santos Arnt
            2: 'Secretário(a)'    // César Becker
        };

        // Detecta parâmetros de embed
        function checkEmbedMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const isEmbed = urlParams.get('embed') === '1' || urlParams.get('embed') === 'true' || window.self !== window.top;
            const isHideHeader = urlParams.get('hide_header') === '1' || urlParams.get('hide_header') === 'true';

            if (isEmbed) {
                document.body.classList.add('is-embedded');
            }
            if (isHideHeader) {
                document.body.classList.add('hide-header');
            }
        }

        // Notifica janela pai sobre alteração de altura
        function notifyParentResize() {
            if (window.self !== window.top) {
                const height = Math.max(
                    document.body.scrollHeight,
                    document.documentElement.scrollHeight,
                    document.body.offsetHeight,
                    document.documentElement.offsetHeight
                );
                window.parent.postMessage({ type: 'sapl-resize', height: height }, '*');
            }
        }

        if (window.ResizeObserver) {
            try {
                const ro = new ResizeObserver(() => notifyParentResize());
                ro.observe(document.body);
            } catch (e) {}
        }

        /**
         * Busca todas as páginas de um endpoint da API SAPL.
         */
        async function fetchAllPages(endpoint) {
            let results = [];
            let url = `${API_BASE}${endpoint}`;
            
            while (url) {
                const response = await fetch(url);
                if (!response.ok) break;
                const data = await response.json();
                results = results.concat(data.results || []);
                url = (data.pagination && data.pagination.links && data.pagination.links.next)
                    ? data.pagination.links.next.replace('http://', 'https://')
                    : null;
            }
            return results;
        }

        async function fetchData() {
            checkEmbedMode();
            try {
                // Busca parlamentares ativos, filiações, partidos e mesa diretora
                const [parlamentares, filiacoes, partidos, compMesa, cargosMesa] = await Promise.all([
                    fetchAllPages('/parlamentares/parlamentar/?ativo=True'),
                    fetchAllPages('/parlamentares/filiacao/'),
                    fetchAllPages('/parlamentares/partido/'),
                    fetchAllPages('/parlamentares/composicaomesa/').catch(() => []),
                    fetchAllPages('/parlamentares/cargomesa/').catch(() => [])
                ]);

                // Filtro estrito: apenas parlamentares onde 'ativo' é explicitamente verdadeiro
                const ativos = parlamentares.filter(p => p.ativo === true || p.ativo === 1 || p.ativo === 'True' || p.ativo === 'true');

                // Mapeia cargos da Mesa Diretora de forma dinâmica
                const cargosMap = { ...MESA_CARGOS_FALLBACK };
                if (compMesa && compMesa.length > 0 && cargosMesa && cargosMesa.length > 0) {
                    compMesa.forEach(comp => {
                        const cargoObj = cargosMesa.find(c => c.id === comp.cargo);
                        if (cargoObj && comp.parlamentar) {
                            cargosMap[comp.parlamentar] = cargoObj.descricao;
                        }
                    });
                }

                render(ativos, filiacoes, partidos, cargosMap);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('loading').innerHTML = 'Erro ao conectar com o sistema SAPL.<br><small>Verifique se o endereço da API está correto.</small>';
            }
        }

        function render(parlamentares, filiacoes, partidos, cargosMap) {
            const mesaGrid = document.getElementById('mesa-grid');
            const vereadoresGrid = document.getElementById('vereadores-grid');
            
            mesaGrid.innerHTML = '';
            vereadoresGrid.innerHTML = '';

            // Processa lista cruzando com partido e cargo
            const listaProcessada = parlamentares.map(p => {
                // Encontra a filiação ativa (onde data_desfiliacao é nulo)
                const filiacao = filiacoes.find(f => f.parlamentar === p.id && f.data_desfiliacao === null);
                let partidoSigla = 'Sem Partido';
                
                if (filiacao) {
                    const partido = partidos.find(part => part.id === filiacao.partido);
                    partidoSigla = partido ? partido.sigla : 'Sem Partido';
                }

                return {
                    ...p,
                    partidoSigla,
                    cargo: cargosMap[p.id] || null
                };
            });

            // 1. Renderiza a Mesa Diretora (Presidente primeiro, depois Vice, depois Secretário)
            const ordemMesa = ['Presidente', 'Vice-Presidente', 'Secretário', 'Secretário(a)'];
            const mesaRenderizados = new Set();

            ordemMesa.forEach(cargoNome => {
                const p = listaProcessada.find(item => item.cargo && item.cargo.toLowerCase().includes(cargoNome.toLowerCase().replace('(a)', '')));
                if (p && !mesaRenderizados.has(p.id)) {
                    mesaGrid.innerHTML += createCard(p);
                    mesaRenderizados.add(p.id);
                }
            });

            // 2. Demais vereadores ativos (sem cargo na mesa) em ordem alfabética
            const demais = listaProcessada
                .filter(p => !mesaRenderizados.has(p.id))
                .sort((a, b) => a.nome_parlamentar.localeCompare(b.nome_parlamentar, 'pt-BR'));

            demais.forEach(p => {
                vereadoresGrid.innerHTML += createCard(p);
            });

            // Esconde o loading e mostra o conteúdo
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // Notifica altura calculada
            notifyParentResize();
            setTimeout(notifyParentResize, 300);
        }

        /**
         * Gera o HTML de um card de parlamentar.
         */
        function createCard(p) {
            const isPresident = p.cargo && p.cargo.toLowerCase().includes('presidente') && !p.cargo.toLowerCase().includes('vice');
            const profileLink = `https://sapl.coronelbarros.rs.leg.br/parlamentar/${p.id}`;
            const photoUrl = p.fotografia ? p.fotografia.replace('http://', 'https://') : 'https://via.placeholder.com/300x400?text=Sem+Foto';
            
            return `
                <a href="${profileLink}" target="_blank" class="card ${isPresident ? 'president' : ''}" title="Ver perfil de ${p.nome_parlamentar} no SAPL">
                    ${p.cargo ? `<span class="badge">${p.cargo}</span>` : ''}
                    <div class="photo-container">
                        <img src="${photoUrl}" alt="${p.nome_parlamentar}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Foto'">
                    </div>
                    <h3>${p.nome_parlamentar}</h3>
                    <p>${p.partidoSigla}</p>
                </a>
            `;
        }

        // Inicia a busca ao carregar a página
        fetchData();
    </script>
</body>
</html>
