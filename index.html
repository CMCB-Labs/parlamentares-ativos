<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereadores em Exercício - CMCB</title>
    <script>
        if (window.self !== window.top || location.search.indexOf('embed=1') !== -1 || location.search.indexOf('embed=true') !== -1) {
            document.documentElement.classList.add('is-embedded');
        }
        if (location.search.indexOf('hide_header=1') !== -1 || location.search.indexOf('hide_header=true') !== -1) {
            document.documentElement.classList.add('hide-header');
        }
    </script>
    <style>
        :root {
            --primary-green: #325a1e; 
            --secondary-green: #5c854b;
            --accent-green: #3ebb51;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-color: #1a1a1a; 
            --text-muted: #555555;
            --gold: #b8860b;
            --gold-light: #fffdf2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Embed Mode Overrides */
        html.is-embedded,
        html.is-embedded body,
        body.is-embedded {
            background: transparent !important;
            min-height: 0 !important;
            height: auto !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        html.is-embedded .container,
        body.is-embedded .container {
            max-width: 100% !important;
            padding: 2px 4px 8px !important;
            margin: 0 auto !important;
        }
        html.hide-header header,
        body.hide-header header {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 10px 15px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-green);
            border-bottom: 3px solid var(--secondary-green);
            display: inline-block;
            padding-bottom: 4px;
        }

        .section-title {
            width: 100%;
            text-align: center;
            margin: 14px 0 10px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--secondary-green);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 38px;
            height: 2.5px;
            background: var(--accent-green);
            margin: 4px auto 0;
            border-radius: 2px;
        }

        /* GRID DA MESA DIRETORA (DESKTOP) */
        #mesa-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            width: 100%;
            margin-bottom: 4px;
        }

        /* GRID DE DEMAIS VEREADORES (DESKTOP) */
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 10px;
            width: 100%;
        }

        /* ESTILO DO CARD PADRÃO */
        .card {
            background: #ffffff;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 9px 7px 11px;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 138px;
            box-sizing: border-box;
            box-shadow: 0 2px 7px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            border-color: var(--secondary-green);
        }

        /* CONTAINER DA FOTO (PROPORÇÃO 3:4) */
        .photo-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 6px;
            border: 1.5px solid #e8ece6;
            background: #f4f6f3;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        .card h3 {
            margin: 3px 0 2px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary-green);
            line-height: 1.2;
            min-height: 2.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card p {
            margin: 0;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* SELO DE CARGO */
        .badge {
            position: absolute;
            top: -9px;
            background: var(--secondary-green);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.64rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            white-space: nowrap;
        }

        /* ORDENAÇÃO NA MESA DIRETORA (DESKTOP) */
        .card-vice {
            order: 1;
        }
        
        .card-secretario {
            order: 3;
        }

        /* DESTAQUE DO PRESIDENTE (NO MEIO E MAIOR) */
        .card-presidente {
            order: 2;
            width: 165px !important;
            padding: 12px 9px 13px !important;
            border: 2px solid var(--gold) !important;
            background: linear-gradient(to bottom, #ffffff, var(--gold-light)) !important;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.18) !important;
            z-index: 3;
        }
        
        .card-presidente:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.25) !important;
        }

        .card-presidente .badge {
            background: var(--gold) !important;
            font-size: 0.70rem !important;
            padding: 3px 11px !important;
            top: -10px !important;
            letter-spacing: 0.5px;
        }

        .card-presidente .photo-container {
            border-color: var(--gold) !important;
        }

        .card-presidente h3 {
            font-size: 0.94rem !important;
        }

        /* MENSAGEM DE CARREGAMENTO */
        #loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 1rem;
            color: var(--secondary-green);
            font-weight: 600;
        }

        /* RESPONSIVIDADE PARA TABLETS E DISPOSITIVOS MÉDIOS */
        @media (max-width: 920px) and (min-width: 601px) {
            .grid {
                max-width: 480px;
                gap: 12px;
            }
        }

        /* RESPONSIVIDADE COMPLETA PARA CELULARES (MOBILE <= 600px) */
        @media (max-width: 600px) {
            .container {
                padding: 4px 6px 12px !important;
            }
            .section-title {
                font-size: 0.95rem;
                margin: 10px 0 8px;
            }
            .section-title::after {
                width: 30px;
                height: 2px;
                margin: 3px auto 0;
            }

            /* MESA DIRETORA NO CELULAR: 3 CARDS LADO A LADO */
            #mesa-grid {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 6px;
                width: 100%;
                margin-bottom: 2px;
            }

            .card-vice,
            .card-secretario {
                width: calc((100% - 22px) / 3) !important;
                max-width: 110px !important;
                min-width: 88px !important;
                padding: 6px 4px 8px !important;
                border-radius: 9px !important;
            }

            /* PRESIDENTE NO CELULAR: NO MEIO, MAIOR COM DESTAQUE DOURADO */
            .card-presidente {
                order: 2 !important;
                width: calc((100% - 22px) / 3 * 1.15) !important;
                max-width: 124px !important;
                min-width: 100px !important;
                padding: 8px 5px 10px !important;
                border-radius: 10px !important;
            }

            .card-presidente .badge {
                font-size: 0.58rem !important;
                padding: 2px 7px !important;
                top: -8px !important;
            }

            .card-presidente h3 {
                font-size: 0.78rem !important;
            }

            /* DEMAIS VEREADORES NO CELULAR: 3 POR LINHA (2 LINHAS DE 3) */
            .grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                width: 100%;
                max-width: 345px;
                margin: 0 auto;
            }

            .grid .card {
                width: 100% !important;
                max-width: 110px !important;
                padding: 6px 4px 8px !important;
                border-radius: 9px !important;
            }

            .photo-container {
                border-radius: 6px;
                margin-bottom: 4px;
            }

            .badge {
                font-size: 0.52rem !important;
                padding: 2px 6px !important;
                top: -7px !important;
                letter-spacing: 0.2px;
            }

            .card h3 {
                font-size: 0.72rem !important;
                line-height: 1.2;
                margin: 2px 0 1px;
                min-height: 2.4em;
            }

            .card p {
                font-size: 0.65rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="parlamentaresContainer">
        <header>
            <h1>VEREADORES EM EXERCÍCIO</h1>
        </header>

        <div id="loading">Conectando ao sistema SAPL...</div>
        
        <div id="content" style="display: none; width: 100%;">
            <div class="section-title">Mesa Diretora</div>
            <div id="mesa-grid"></div>

            <div class="section-title">Demais Vereadores</div>
            <div id="vereadores-grid" class="grid"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://sapl.coronelbarros.rs.leg.br/api';
        
        const MESA_CARGOS_FALLBACK = {
            1: 'Presidente',
            7: 'Vice-Presidente',
            2: 'Secretário(a)'
        };

        let lastSentHeight = 0;
        let resizeTimer = null;

        function notifyParentResize() {
            if (window.self === window.top) return;

            // Só envia sinal de redimensionamento global se solicitado explicitamente
            const urlParams = new URLSearchParams(window.location.search);
            const allowResize = urlParams.get('auto_resize') === '1' || window.name === 'windowZ';
            if (!allowResize) return;

            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const container = document.getElementById('parlamentaresContainer') || document.body;
                const rect = container.getBoundingClientRect();
                const exactHeight = Math.ceil(rect.height) + 6;

                if (Math.abs(lastSentHeight - exactHeight) >= 3) {
                    lastSentHeight = exactHeight;
                    window.parent.postMessage({
                        type: 'sapl-resize',
                        frameId: 'parlamentares-ativos',
                        height: exactHeight
                    }, '*');
                }
            }, 40);
        }

        async function fetchAllPages(endpoint) {
            let results = [];
            let url = `${API_BASE}${endpoint}`;
            
            while (url) {
                const response = await fetch(url);
                if (!response.ok) break;
                const data = await response.json();
                results = results.concat(data.results || []);
                url = (data.pagination && data.pagination.links && data.pagination.links.next)
                    ? data.pagination.links.next.replace('http://', 'https://')
                    : null;
            }
            return results;
        }

        function getCargoType(cargo) {
            if (!cargo) return null;
            const norm = cargo.toLowerCase().trim();
            if (norm.includes('vice')) return 'vice';
            if (norm.includes('presidente')) return 'presidente';
            if (norm.includes('secret')) return 'secretario';
            return null;
        }

        async function fetchData() {
            try {
                const [parlamentares, filiacoes, partidos, compMesa, cargosMesa] = await Promise.all([
                    fetchAllPages('/parlamentares/parlamentar/?ativo=True'),
                    fetchAllPages('/parlamentares/filiacao/'),
                    fetchAllPages('/parlamentares/partido/'),
                    fetchAllPages('/parlamentares/composicaomesa/').catch(() => []),
                    fetchAllPages('/parlamentares/cargomesa/').catch(() => [])
                ]);

                const ativos = parlamentares.filter(p => p.ativo === true || p.ativo === 1 || p.ativo === 'True' || p.ativo === 'true');

                const cargosMap = { ...MESA_CARGOS_FALLBACK };
                if (compMesa && compMesa.length > 0 && cargosMesa && cargosMesa.length > 0) {
                    compMesa.forEach(comp => {
                        const cargoObj = cargosMesa.find(c => c.id === comp.cargo);
                        if (cargoObj && comp.parlamentar) {
                            cargosMap[comp.parlamentar] = cargoObj.descricao;
                        }
                    });
                }

                render(ativos, filiacoes, partidos, cargosMap);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('loading').innerHTML = 'Erro ao conectar com o sistema SAPL.<br><small>Verifique se o endereço da API está correto.</small>';
            }
        }

        function render(parlamentares, filiacoes, partidos, cargosMap) {
            const mesaGrid = document.getElementById('mesa-grid');
            const vereadoresGrid = document.getElementById('vereadores-grid');
            
            mesaGrid.innerHTML = '';
            vereadoresGrid.innerHTML = '';

            const listaProcessada = parlamentares.map(p => {
                const filiacao = filiacoes.find(f => f.parlamentar === p.id && f.data_desfiliacao === null);
                let partidoSigla = 'Sem Partido';
                
                if (filiacao) {
                    const partido = partidos.find(part => part.id === filiacao.partido);
                    partidoSigla = partido ? partido.sigla : 'Sem Partido';
                }

                const cargo = cargosMap[p.id] || null;
                const cargoType = getCargoType(cargo);

                return {
                    ...p,
                    partidoSigla,
                    cargo,
                    cargoType
                };
            });

            const pres = listaProcessada.find(p => p.cargoType === 'presidente');
            const vice = listaProcessada.find(p => p.cargoType === 'vice');
            const sec = listaProcessada.find(p => p.cargoType === 'secretario');

            const mesaIds = new Set();

            if (vice) {
                mesaGrid.innerHTML += createCard(vice, 'vice');
                mesaIds.add(vice.id);
            }
            if (pres) {
                mesaGrid.innerHTML += createCard(pres, 'presidente');
                mesaIds.add(pres.id);
            }
            if (sec) {
                mesaGrid.innerHTML += createCard(sec, 'secretario');
                mesaIds.add(sec.id);
            }

            const demais = listaProcessada
                .filter(p => !mesaIds.has(p.id))
                .sort((a, b) => a.nome_parlamentar.localeCompare(b.nome_parlamentar, 'pt-BR'));

            demais.forEach(p => {
                vereadoresGrid.innerHTML += createCard(p, null);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            notifyParentResize();
        }

        function createCard(p, cargoType) {
            let cardClasses = 'card';
            if (cargoType === 'presidente') cardClasses += ' card-presidente';
            else if (cargoType === 'vice') cardClasses += ' card-vice';
            else if (cargoType === 'secretario') cardClasses += ' card-secretario';

            const profileLink = `https://sapl.coronelbarros.rs.leg.br/parlamentar/${p.id}`;
            const photoUrl = p.fotografia ? p.fotografia.replace('http://', 'https://') : 'https://via.placeholder.com/300x400?text=Sem+Foto';
            
            return `
                <a href="${profileLink}" target="_blank" class="${cardClasses}" title="Ver perfil de ${p.nome_parlamentar} no SAPL">
                    ${p.cargo ? `<span class="badge">${p.cargo}</span>` : ''}
                    <div class="photo-container">
                        <img src="${photoUrl}" alt="${p.nome_parlamentar}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Foto'">
                    </div>
                    <h3>${p.nome_parlamentar}</h3>
                    <p>${p.partidoSigla}</p>
                </a>
            `;
        }

        fetchData();
    </script>
</body>
</html>
